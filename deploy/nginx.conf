# /etc/nginx/sites-available/calculator.conf
# This configuration demonstrates how a real web server handles both
# the Frontend (React static files) and the Backend (Java REST API) on Port 80 (HTTP)

server {
    listen 80;
    server_name your-server-domain-or-ip.com;

    # 1. Frontend: Serve compiled React static files (HTML, JS, CSS)
    root /var/www/calculator-app/dist;
    index index.html;

    location / {
        # Try to serve the exact file requested. If not found,
        # fallback to index.html (crucial for Single Page Applications / React Router)
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend: Reverse Proxy requests starting with /api to Spring Boot
    location /api/ {
        # Forward requests to Spring Boot running locally on port 8080
        proxy_pass http://127.0.0.1:8080/api/;
        
        # Preserve original client IP and request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Gzip compression for high performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
