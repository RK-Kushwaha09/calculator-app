# Server Configuration (Supports Render dynamic $PORT)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=calculator-backend

# MySQL Database Configuration
# In production on Render/TiDB Cloud, useSSL=true is strictly required by TiDB
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:test}?useSSL=${MYSQL_USE_SSL:true}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.com.calculator=INFO
